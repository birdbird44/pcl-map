<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PCL Global Offices</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a1628; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header { background: #0d1b3e; border-bottom: 1px solid rgba(245,200,0,0.3); padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  header .logo { font-size: 20px; font-weight: 700; color: #F5C800; letter-spacing: 0.05em; }
  header .subtitle { font-size: 13px; color: rgba(255,255,255,0.5); }
  header .dot { width: 6px; height: 6px; border-radius: 50%; background: #F5C800; opacity: 0.6; }

  .layout { display: flex; flex: 1; overflow: hidden; }

  .sidebar { width: 260px; min-width: 260px; background: #0d1b3e; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.08); }
  .sidebar-header { padding: 18px 18px 12px; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
  .sidebar-header p.label { font-size: 10px; font-weight: 600; color: #F5C800; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
  .sidebar-header p.count { font-size: 11px; color: rgba(255,255,255,0.4); }
  .sidebar-list { overflow-y: auto; flex: 1; padding: 6px 0; }

  .office-item { padding: 11px 18px; cursor: pointer; border-bottom: 0.5px solid rgba(255,255,255,0.05); transition: background 0.15s; }
  .office-item:hover { background: rgba(245,200,0,0.07); }
  .office-item.active { background: rgba(245,200,0,0.12); border-left: 2px solid #F5C800; }
  .office-item .row { display: flex; align-items: center; gap: 10px; }
  .office-item .flag { font-size: 18px; line-height: 1; flex-shrink: 0; }
  .office-item .name { font-size: 12px; font-weight: 500; color: #fff; line-height: 1.3; }
  .office-item .city { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; }

  #map { flex: 1; height: 100%; }

  #tooltip {
    position: fixed;
    display: none;
    background: #0d1b3e;
    border: 1px solid #F5C800;
    border-radius: 8px;
    padding: 14px 16px;
    max-width: 240px;
    pointer-events: none;
    z-index: 9999;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #tooltip .tt-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #tooltip .tt-flag { font-size: 22px; line-height: 1; flex-shrink: 0; }
  #tooltip .tt-short { font-size: 13px; font-weight: 600; color: #F5C800; }
  #tooltip .tt-city { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 1px; }
  #tooltip .tt-entity { font-size: 11px; color: rgba(255,255,255,0.8); line-height: 1.5; margin-bottom: 8px; }
  #tooltip .tt-address { font-size: 10px; color: rgba(255,255,255,0.45); line-height: 1.6; white-space: pre-line; border-top: 0.5px solid rgba(255,255,255,0.1); padding-top: 8px; }

  .leaflet-container { background: #0a1628; }
</style>
</head>
<body>

<header>
  <span class="logo">PCL</span>
  <div class="dot"></div>
  <span class="subtitle">Global Office Locations</span>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <p class="label">Offices</p>
      <p class="count">8 locations worldwide</p>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
  </div>

  <div id="map"></div>
</div>

<div id="tooltip">
  <div class="tt-top">
    <span class="tt-flag" id="tt-flag"></span>
    <div>
      <div class="tt-short" id="tt-short"></div>
      <div class="tt-city" id="tt-city"></div>
    </div>
  </div>
  <div class="tt-entity" id="tt-entity"></div>
  <div class="tt-address" id="tt-address"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const offices = [
  { entity:"Pacific Carriers Limited", short:"PCL HQ", city:"Singapore", flag:"🇸🇬", lat:1.2897, lng:103.8276, address:"No 1 Kim Seng Promenade\n#07-01 Great World City\nSingapore 237994" },
  { entity:"PCL (Shipping) Beijing Co., Ltd", short:"PCL Beijing", city:"Beijing, China", flag:"🇨🇳", lat:39.935, lng:116.42, address:"Rm 0716 Sanli Dasha\nNo.208 Andingmenwai Dajie\nBeijing 100011" },
  { entity:"PACC Line Pte Ltd", short:"PACC Line", city:"Hamburg, Germany", flag:"🇩🇪", lat:53.5488, lng:9.9872, address:"Cremon 1\n20457 Hamburg\nGermany" },
  { entity:"PCL Shipping Private Limited", short:"PCL India", city:"Mumbai, India", flag:"🇮🇳", lat:19.005, lng:72.8258, address:"A 404, Naman Midtown\nSenapati Bapat Marg, Elphinstone\nMumbai 400 013" },
  { entity:"PACC Ship Managers Pte Ltd", short:"PACC Jakarta", city:"Jakarta, Indonesia", flag:"🇮🇩", lat:-6.1571, lng:106.9003, address:"Harton Tower, Lantai 7 Unit 7C\nBlok D Kav.3, Kelapa Gading\nJakarta Utara 14240" },
  { entity:"Malaysian Bulk Carriers Berhad", short:"MBC", city:"Kuala Lumpur, Malaysia", flag:"🇲🇾", lat:3.1179, lng:101.684, address:"Unit 11.03A, Level 11, Mercu 2\nNo. 3, Jalan Bangsar, KL Eco City\nKuala Lumpur 59200" },
  { entity:"PACC Shipping Phils., Inc", short:"PACC Philippines", city:"Manila, Philippines", flag:"🇵🇭", lat:14.5547, lng:120.9934, address:"B & C, 9th Floor\nRamon Magsaysay Center\n1680 Roxas Boulevard, Manila" },
  { entity:"PCL Shipping Inc.", short:"PCL New York", city:"New York, USA", flag:"🇺🇸", lat:40.7614, lng:-73.9735, address:"477 Madison Avenue, 6th Floor\nManhattan, New York 10022" }
];

const NAVY = "#1B3A8C";
const YELLOW = "#F5C800";

const map = L.map('map', { center:[15,55], zoom:2, zoomControl:true, scrollWheelZoom:true });

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
  maxZoom:18
}).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
  attribution:'', maxZoom:18, opacity:0.5
}).addTo(map);

const makeIcon = (active) => L.divIcon({
  html: `<svg xmlns="http://www.w3.org/2000/svg" width="${active?34:26}" height="${active?44:34}" viewBox="0 0 28 36">
    <path d="M14 0C6.27 0 0 6.27 0 14c0 9.5 14 22 14 22S28 23.5 28 14C28 6.27 21.73 0 14 0z" fill="${active?YELLOW:NAVY}" stroke="${active?NAVY:YELLOW}" stroke-width="2"/>
    <circle cx="14" cy="14" r="5" fill="${active?NAVY:YELLOW}"/>
  </svg>`,
  className:'',
  iconSize:[active?34:26, active?44:34],
  iconAnchor:[active?17:13, active?44:34]
});

const tooltip = document.getElementById('tooltip');
const ttFlag = document.getElementById('tt-flag');
const ttShort = document.getElementById('tt-short');
const ttCity = document.getElementById('tt-city');
const ttEntity = document.getElementById('tt-entity');
const ttAddress = document.getElementById('tt-address');
const sidebarList = document.getElementById('sidebar-list');

let activeMarker = null;
let activeItem = null;

offices.forEach((o, i) => {
  const marker = L.marker([o.lat, o.lng], { icon: makeIcon(false) }).addTo(map);

  const item = document.createElement('div');
  item.className = 'office-item';
  item.innerHTML = `
    <div class="row">
      <span class="flag">${o.flag}</span>
      <div>
        <div class="name">${o.short}</div>
        <div class="city">${o.city}</div>
      </div>
    </div>`;

  item.addEventListener('click', () => {
    map.setView([o.lat, o.lng], 5, { animate:true });
    if (activeMarker) activeMarker.setIcon(makeIcon(false));
    if (activeItem) activeItem.classList.remove('active');
    marker.setIcon(makeIcon(true));
    activeMarker = marker;
    item.classList.add('active');
    activeItem = item;
  });

  sidebarList.appendChild(item);

  marker.on('mouseover', function(e) {
    if (activeMarker !== marker) this.setIcon(makeIcon(true));
    ttFlag.textContent = o.flag;
    ttShort.textContent = o.short;
    ttCity.textContent = o.city;
    ttEntity.textContent = o.entity;
    ttAddress.textContent = o.address;
    tooltip.style.display = 'block';
  });
  marker.on('mousemove', function(e) {
    const x = e.originalEvent.clientX;
    const y = e.originalEvent.clientY;
    const tw = tooltip.offsetWidth;
    const th = tooltip.offsetHeight;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    tooltip.style.left = (x + 18 + tw > vw ? x - tw - 12 : x + 18) + 'px';
    tooltip.style.top  = (y - 10 + th > vh ? vh - th - 10 : y - 10) + 'px';
  });
  marker.on('mouseout', function(e) {
    if (activeMarker !== marker) this.setIcon(makeIcon(false));
    tooltip.style.display = 'none';
  });
  marker.on('click', function() {
    map.setView([o.lat, o.lng], 5, { animate:true });
    if (activeMarker) activeMarker.setIcon(makeIcon(false));
    if (activeItem) activeItem.classList.remove('active');
    this.setIcon(makeIcon(true));
    activeMarker = marker;
    item.classList.add('active');
    activeItem = item;
  });
});
</script>
</body>
</html>
